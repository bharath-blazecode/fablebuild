<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Brisbane: Inside Job</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0b14">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b14; touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #ff9a3d; font-weight: 800; letter-spacing: .2em; z-index: 100; }
    #err { position: fixed; left: 8px; bottom: 8px; right: 8px; color: #ff8a8a; font: 12px monospace; z-index: 200; pointer-events: none; white-space: pre-wrap; }
  </style>
  <!-- The import map tells the browser where the 'three' library lives (served from node_modules by server.js). -->
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading">BUILDING BRISBANE…</div>
  <div id="err"></div>
  <script>
    // Show errors on screen so problems are visible on phones, where there is no console.
    window.__err = function (m) { var e = document.getElementById('err'); if (e) e.textContent = (e.textContent + '\n' + m).slice(-600); };
    window.addEventListener('error', function (e) { window.__err(e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
    window.addEventListener('unhandledrejection', function (e) { window.__err('promise: ' + (e.reason && e.reason.message || e.reason)); });
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
